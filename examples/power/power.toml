# Theme for power.nu, after rofi's powermenu style-1 with a base16
# "default dark" palette:
#
#     sieb --config examples/power/power.toml --script examples/power/power.nu

font = "JetBrainsMono Nerd Font"
font-size = 13.333        # 10pt
width = 400
lines = 6
padding = 20
radius = 12
border-width = 0
spacing = 10
separator-width = 0
input-padding = 10
row-padding = 10.5
row-spacing = 5
row-radius = 10
message-padding = 10
placeholder = "search..."
badge = ""
counter = false

[colors]
background = "#1e1e1ee6"
text = "#dfe1e8"
accent = "#dfe1e8"
placeholder = "#dfe1e8"
selected = "#8a8177"
selected-text = "#1e1e1e"
match = "#8a8177"
selected-match = "#dfe1e8"
badge = "#1e1e1e"
badge-background = "#ac4142e6"
prompt = "#1e1e1e"
prompt-background = "#6c99bae6"
message = "#dfe1e8"
message-background = "#2c2f33e6"
backdrop = "#00000000"
