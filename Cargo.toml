[package]
name = "sieb"
version = "0.1.0"
edition = "2024"
description = "dmenu-first Wayland picker, extended through scripts"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
fontconfig = "0.11"
nucleo = "0.5.0"
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = "0.21"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = "1.1"
unicode-segmentation = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
