[package]
name = "sieb"
version = "0.1.0"
edition = "2024"
description = "dmenu-first Wayland picker, extended through scripts"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
fontconfig = "0.11"
nucleo = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smithay-client-toolkit = "0.21"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = "1.1"
unicode-segmentation = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# A frame is per-pixel work (shaping, rasterizing, blending), and at
# opt-level 0 a debug frame took 41ms against 3ms in release: visible lag
# while typing.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
