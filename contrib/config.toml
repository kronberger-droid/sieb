# sieb reads this from $XDG_CONFIG_HOME/sieb/config.toml, or from the
# path given with --config. Every key is optional and also exists as a
# flag, which wins over the file: `lines` is `--lines`, `colors.border` is
# `--color-border`. The values below are the built-in defaults.
#
# Sizes are logical pixels. Colors are #rgb, #rrggbb or #rrggbbaa.
# launcher.toml and power.toml next to this file are complete themes.

font = "sans-serif"   # any fontconfig family or alias
font-size = 15        # rows grow with it
lines = 10
width = 640
padding = 10          # around everything
spacing = 3           # between the input, separator, message and list
radius = 12
border-width = 1      # 0 for none
separator-width = 1   # the line under the input, 0 for none
input-padding = 6.5   # around the prompt, badge and query
row-padding = 6.5     # around each row's text
row-spacing = 0       # between rows
row-radius = 6        # rows, the message box and the pills
message-padding = 6.5
placeholder = ""      # shown while the query is empty
badge = ""            # a pill left of the prompt, empty for none
counter = true        # matched/total right of the query
scrollbar = false

# Colors without a default here fall back to the one named after them.
[colors]
background = "#1e1e2ef2"
border = "#585b70"
selected = "#313244"
# selected-text       text
separator = "#313244"
text = "#cdd6f4"
dim = "#7f849c"       # the match counter
accent = "#f5c2e7"    # the caret
# match               accent, matched characters
# selected-match      match, on the selected row
# row                 none, behind the other rows
# placeholder         dim
# prompt              accent
# prompt-background   none
# badge               background, opaque
# badge-background    accent
# message             dim
# message-background  none
# scrollbar           separator, the track
# scrollbar-handle    dim
# button              scrollbar, the mode buttons
# button-text         text
# button-selected     accent, the button of the mode on screen
# button-selected-text  background, opaque
backdrop = "#00000040" # tint over the rest of the output, #00000000 for none
