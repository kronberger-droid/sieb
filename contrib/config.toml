# sieb reads this from $XDG_CONFIG_HOME/sieb/config.toml, or from the
# path given with --config. Every key is optional and also exists as a
# flag, which wins over the file: `lines` is `--lines`, `colors.border` is
# `--color-border`. The values below are the built-in defaults.
#
# Colors are #rgb, #rrggbb or #rrggbbaa.

font = "sans-serif"   # any fontconfig family or alias
font-size = 15        # logical pixels; rows grow with it
lines = 10
width = 640
padding = 10
radius = 12
border-width = 1      # 0 for none

[colors]
background = "#1e1e2ef2"
border = "#585b70"
selected = "#313244"
separator = "#313244"
text = "#cdd6f4"
dim = "#7f849c"       # the match counter
accent = "#f5c2e7"    # prompt, caret and matched characters
backdrop = "#00000040" # tint over the rest of the output, #00000000 for none
